[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stressproof-backend"
version = "0.1.0"
description = "FastAPI backend and content-addressed storage service for StressProof"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stressproof-core",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stressproof_backend"]
