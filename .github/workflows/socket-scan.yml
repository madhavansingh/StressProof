# Socket supply-chain scan (WP-1; implementation plan S-13).
# Scans frontend/package-lock.json (npm) and the uv workspace (uv.lock) with the pinned Socket CLI via
# scripts/socket_scan.sh. If the repository secret SOCKET_SECURITY_API_TOKEN is configured (a Socket API token with
# full-scans:create, full-scans:list and security-policy:read), the full scan runs. Without it, the job logs a
# notice and exits cleanly without failing CI. Pull requests from forks receive no secrets.
name: Socket supply-chain scan

on:
  pull_request:
  push:
    branches: [main, blockchain]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # the Socket CLI requires Node.js 22 or newer
      - name: Socket scan
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: |
          set +e
          bash scripts/socket_scan.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::notice title=Socket Scan Skipped::No Socket API token configured in repository secrets (SOCKET_SECURITY_API_TOKEN missing). To enable automated supply-chain scanning, add SOCKET_SECURITY_API_TOKEN in GitHub repository settings."
            exit 0
          elif [ $exit_code -ne 0 ]; then
            echo "Socket scan failed with exit code $exit_code" >&2
            exit $exit_code
          fi
      - name: Keep the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-report
          path: socket-report/
          if-no-files-found: ignore
