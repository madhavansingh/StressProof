[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stressproof-agents"
version = "0.1.0"
description = "Autonomous agent daemons (attester, watcher, resolver CLI) for StressProof"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stressproof-core",
    "web3>=7.16,<8",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stressproof_agents"]
