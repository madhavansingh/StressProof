[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# Scripts may read the project, and may write only the shared deployments folder (plan §8.7).
fs_permissions = [
    { access = "read", path = "./" },
    { access = "write", path = "../deployments" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8546"
base_sepolia = "${TESTNET_RPC_URL}"
