[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# Forge may read the project and the deployments folder, and write nothing.
# deployments/<chainId>.json is written by scripts/deploy.sh only after confirmed receipts.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../deployments" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8546"
base_sepolia = "${TESTNET_RPC_URL}"
